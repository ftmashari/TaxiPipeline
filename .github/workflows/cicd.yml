
name: ETL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Check image-related changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            image:
              - 'Dockerfile'
              - 'requirements.txt'
              - 'etl/src/**'

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && steps.changes.outputs.image == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'push' && steps.changes.outputs.image == 'true'
        run: docker build -t ftmashari/taxipipeline-etl:latest .

      - name: Push Docker image
        if: github.event_name == 'push' && steps.changes.outputs.image == 'true'
        run: docker push ftmashari/taxipipeline-etl:latest
